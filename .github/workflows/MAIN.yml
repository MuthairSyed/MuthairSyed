name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: MuthairSyed
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

      - name: Publish snake to output branch
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated files outside the Git working tree
          mkdir -p /tmp/snake-dist
          cp -r dist/. /tmp/snake-dist/

          # Switch to output branch, creating it if necessary
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          # Remove previous generated files
          rm -rf github-contribution-grid-snake.gif
          rm -rf github-contribution-grid-snake.svg

          # Copy new generated files
          cp /tmp/snake-dist/github-contribution-grid-snake.gif .
          cp /tmp/snake-dist/github-contribution-grid-snake.svg .

          # Commit and push
          git add github-contribution-grid-snake.gif
          git add github-contribution-grid-snake.svg

          git commit -m "Update contribution snake" || echo "No changes to commit"

          git push origin output
